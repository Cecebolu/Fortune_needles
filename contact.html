{% extends "base.html" %}

{% block title %}Manage Contact{% endblock %}

{% block content %}
<section class="container py-5 mt-5">

    <h1 class="fw-bold">Manage Contact Information</h1>
    <p class="text-muted">
        Update contact details and social media links.
    </p>

    <div class="card shadow-sm border-0 p-4">

        <div class="mb-3">
            <label class="form-label">Phone Number</label>
            <input type="text"
                   class="form-control"
                   value="+254 0114 725 119">
        </div>

        <div class="mb-3">
            <label class="form-label">Email</label>
            <input type="email"
                   class="form-control"
                   value="info@fortuneneedles.com">
        </div>

        <div class="mb-3">
            <label class="form-label">Location</label>
            <input type="text"
                   class="form-control"
                   value="Nakuru, Kenya">
        </div>

        <button class="btn btn-dark">
            Save Changes
        </button>

    </div>

</section>
{% endblock %}
