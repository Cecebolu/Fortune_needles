{% extends "base.html" %}

{% block title %}Edit Product{% endblock %}

{% block content %}

<section class="container py-5 mt-5">

    <div class="row justify-content-center">

        <div class="col-lg-8">

            <div class="card shadow border-0">

                <div class="card-header bg-warning">

                    <h3 class="mb-0 text-dark">
                        Edit Product
                    </h3>

                </div>

                <div class="card-body">

                    <form method="POST">

                        <div class="mb-3">

                            <label class="form-label">
                                Product Name
                            </label>

                            <input
                                type="text"
                                name="name"
                                class="form-control"
                                value="{{ product.name }}"
                                required
                            >

                        </div>

                        <div class="mb-3">

                            <label class="form-label">
                                Description
                            </label>

                            <textarea
                                name="description"
                                class="form-control"
                                rows="5"
                            >{{ product.description }}</textarea>

                        </div>

                        <div class="row">

                            <div class="col-md-6">

                                <div class="mb-3">

                                    <label class="form-label">
                                        Category
                                    </label>

                                    <input
                                        type="text"
                                        name="category"
                                        class="form-control"
                                        value="{{ product.category }}"
                                    >

                                </div>

                            </div>

                            <div class="col-md-6">

                                <div class="mb-3">

                                    <label class="form-label">
                                        Price (KES)
                                    </label>

                                    <input
                                        type="number"
                                        name="price"
                                        step="0.01"
                                        class="form-control"
                                        value="{{ product.price }}"
                                        required
                                    >

                                </div>

                            </div>

                        </div>

                        <div class="row">

                            <div class="col-md-6">

                                <div class="mb-3">

                                    <label class="form-label">
                                        Stock
                                    </label>

                                    <input
                                        type="number"
                                        name="stock"
                                        class="form-control"
                                        value="{{ product.stock }}"
                                    >

                                </div>

                            </div>

                            <div class="col-md-6">

                                <div class="mb-3">

                                    <label class="form-label">
                                        Availability
                                    </label>

                                    <select
                                        name="is_available"
                                        class="form-select"
                                    >

                                        <option
                                            value="True"
                                            {% if product.is_available %}selected{% endif %}
                                        >
                                            Available
                                        </option>

                                        <option
                                            value="False"
                                            {% if not product.is_available %}selected{% endif %}
                                        >
                                            Out of Stock
                                        </option>

                                    </select>

                                </div>

                            </div>

                        </div>

                        <div class="d-flex justify-content-between">

                            <a
                                href="{{ url_for('admin_products') }}"
                                class="btn btn-secondary"
                            >
                                Cancel
                            </a>

                            <button
                                type="submit"
                                class="btn btn-warning"
                            >
                                Update Product
                            </button>

                        </div>

                    </form>

                </div>

            </div>

        </div>

    </div>

</section>

{% endblock %}
