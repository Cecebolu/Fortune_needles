{% extends "admin/admin_base.html" %}

{% block title %}Manage About{% endblock %}

{% block content %}

<section class="container py-5 mt-5">

    <h1 class="fw-bold mb-4">
        Manage About Page
    </h1>

    <div class="card shadow-sm border-0 p-4">

        <form method="POST">

            <div class="mb-3">
                <label class="form-label">
                    Page Title
                </label>

                <input
                    type="text"
                    name="title"
                    class="form-control"
                    value="{{ about.title }}"
                    required
                >
            </div>

            <div class="mb-3">
                <label class="form-label">
                    Subtitle
                </label>

                <input
                    type="text"
                    name="subtitle"
                    class="form-control"
                    value="{{ about.subtitle or '' }}"
                >
            </div>

            <div class="mb-3">
                <label class="form-label">
                    Description
                </label>

                <textarea
                    name="description"
                    class="form-control"
                    rows="8"
                    required
                >{{ about.description }}</textarea>
            </div>

            <small class="text-muted d-block mb-3">
                Leave an empty line between paragraphs.
            </small>

            <button
                type="submit"
                class="btn btn-dark"
            >
                Save Changes
            </button>

            <a href="{{ url_for('public.about') }}"
               class="btn btn-outline-dark ms-2"
               target="_blank">
                View Page
            </a>

        </form>

    </div>

</section>

{% endblock %}
