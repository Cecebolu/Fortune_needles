{% extends "base.html" %}

{% block title %}Gallery{% endblock %}

{% block content %}

<section class="container py-5 mt-5">

    <div class="text-center mb-5">
        <h1 class="fw-bold">Gallery</h1>
        <p class="lead text-muted">A look at some of our work</p>
    </div>

    <div class="gallery-masonry">

        {% for item in images %}
        <figure class="gallery-tile">
            <a href="{{ url_for('static', filename='uploads/gallery/' + item.image) }}" class="gallery-open"
               data-caption="{{ item.title or '' }}">
                <img src="{{ url_for('static', filename='uploads/gallery/' + item.image) }}"
                     alt="{{ item.title or 'Fortune Needles work' }}" loading="lazy">
            </a>
            {% if item.title or item.description %}
            <figcaption>
                {% if item.title %}<strong>{{ item.title }}</strong>{% endif %}
                {% if item.description %}<span>{{ item.description }}</span>{% endif %}
            </figcaption>
            {% endif %}
        </figure>
        {% else %}
        {% for number in range(1, 6) %}
        <figure class="gallery-tile">
            <a href="{{ url_for('static', filename='images/gallery/gallery' ~ number ~ '.jpg') }}" class="gallery-open" data-caption="">
                <img src="{{ url_for('static', filename='images/gallery/gallery' ~ number ~ '.jpg') }}"
                     alt="Fortune Needles work" loading="lazy">
            </a>
        </figure>
        {% endfor %}
        {% endfor %}

    </div>

</section>

<!-- Full-size viewer -->
<div class="modal fade" id="photoModal" tabindex="-1" aria-label="Photo viewer" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered modal-xl">
        <div class="modal-content bg-transparent border-0">
            <button type="button" class="btn-close btn-close-white ms-auto mb-2" data-bs-dismiss="modal" aria-label="Close"></button>
            <img id="photoModalImage" src="" alt="" class="photo-modal-image">
            <p id="photoModalCaption" class="text-center text-white mt-3 mb-0"></p>
        </div>
    </div>
</div>

<script>
document.addEventListener("DOMContentLoaded", function () {
    const modal = new bootstrap.Modal(document.getElementById("photoModal"));
    const image = document.getElementById("photoModalImage");
    const caption = document.getElementById("photoModalCaption");

    document.querySelectorAll(".gallery-open").forEach(function (link) {
        link.addEventListener("click", function (event) {
            event.preventDefault();
            image.src = link.href;
            image.alt = link.dataset.caption || "Fortune Needles work";
            caption.textContent = link.dataset.caption;
            modal.show();
        });
    });
});
</script>

{% endblock %}
