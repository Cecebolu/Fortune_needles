{% extends "base.html" %}

{% block title %}Choose a New Password{% endblock %}

{% block content %}

<section class="auth-section">

    <canvas class="thread-canvas" data-thread data-needles="3" data-thread-color="#b8860b" data-needle-color="#cfcfcf" aria-hidden="true"></canvas>

    <div class="container">

        <div class="row justify-content-center">

            <div class="col-lg-5">

                <div class="auth-card shadow-lg">

                    <div class="text-center mb-4">
                        <span class="auth-key-icon"><i class="bi bi-shield-lock-fill"></i></span>
                        <h2>New Password</h2>
                        <p class="text-muted">Hi {{ user.first_name }}, choose a new password for your account.</p>
                    </div>

                    <form method="POST">

                        <div class="mb-3">
                            <label class="form-label" for="password">New password</label>
                            <div class="input-group">
                                <input type="password" id="password" name="password" class="form-control" required
                                       minlength="{{ min_length }}" autocomplete="new-password" autofocus>
                                <button type="button" class="btn btn-outline-secondary js-show-password" aria-label="Show password">
                                    <i class="bi bi-eye"></i>
                                </button>
                            </div>
                            <small class="text-muted">At least {{ min_length }} characters.</small>
                        </div>

                        <div class="mb-4">
                            <label class="form-label" for="confirm_password">Confirm new password</label>
                            <input type="password" id="confirm_password" name="confirm_password" class="form-control" required
                                   minlength="{{ min_length }}" autocomplete="new-password">
                        </div>

                        <button type="submit" class="btn btn-gold w-100">Save New Password</button>

                    </form>

                </div>

            </div>

        </div>

    </div>

</section>

<script>
document.querySelectorAll(".js-show-password").forEach(function (button) {
    button.addEventListener("click", function () {
        const input = button.parentElement.querySelector("input");
        const showing = input.type === "text";
        input.type = showing ? "password" : "text";
        button.querySelector("i").className = showing ? "bi bi-eye" : "bi bi-eye-slash";
        button.setAttribute("aria-label", showing ? "Show password" : "Hide password");
    });
});
</script>

{% endblock %}
