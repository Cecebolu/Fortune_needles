{% extends "base.html" %}

{% block title %}Login{% endblock %}

{% block content %}

<section class="auth-section">

    <canvas class="thread-canvas" data-thread data-needles="3" data-thread-color="#b8860b" data-needle-color="#cfcfcf" aria-hidden="true"></canvas>

    <div class="container">

        <div class="row justify-content-center">

            <div class="col-lg-5">

                <div class="auth-card shadow-lg">

                    <div class="text-center mb-4">

                        <img src="{{ url_for('static', filename='images/logo.png') }}"
                             class="auth-logo">

                        <h2>Welcome Back</h2>

                        <p class="text-muted">
                            Login to your Fortune Needles account.
                        </p>

                    </div>


                    <form method="POST">

                        <div class="mb-3">

                            <label class="form-label">Username or Email</label>

                            <input
                                type="text"
                                name="username"
                                class="form-control"
                                placeholder="Enter your username or email"
                                required>

                        </div>

                        <div class="mb-4">

                            <label class="form-label">Password</label>

                            <input
                                type="password"
                                name="password"
                                class="form-control"
                                placeholder="Enter your password"
                                required>

                        </div>

                        <div class="text-end mb-3" style="margin-top:-8px">
                            <a href="{{ url_for('auth.forgot_password') }}" class="small">Forgot password?</a>
                        </div>

                        <button
                            type="submit"
                            class="btn btn-gold w-100">

                            Login

                        </button>

                    </form>

                    <hr>

                    <p class="text-center">

                        Don't have an account?

                        <a href="{{ url_for('auth.signup') }}">
                            Create Account
                        </a>

                    </p>

                </div>

            </div>

        </div>

    </div>

</section>

{% endblock %}
