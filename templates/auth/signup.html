{% extends "base.html" %}

{% block title %}Create Account{% endblock %}

{% block content %}

<section class="auth-section">

    <canvas class="thread-canvas" data-thread data-needles="3" data-palette="light" aria-hidden="true"></canvas>

    <div class="container">

        <div class="row justify-content-center">

            <div class="col-lg-6">

                <div class="auth-card shadow-lg">

                    <div class="text-center mb-4">

                        <img src="{{ url_for('static', filename='images/logo.png') }}"
                             class="auth-logo">

                        <h2>Create Account</h2>

                        <p class="text-muted">
                            Join Fortune Needles today.
                        </p>

                    </div>

                    <form method="POST">

                        <div class="row">

                            <div class="col-md-6 mb-3">

                                <label>First Name</label>

                                <input
                                    type="text"
                                    name="first_name"
                                    class="form-control"
                                    required>

                            </div>

                            <div class="col-md-6 mb-3">

                                <label>Last Name</label>

                                <input
                                    type="text"
                                    name="last_name"
                                    class="form-control"
                                    required>

                            </div>

                        </div>

                        <div class="mb-3">

                            <label>Username</label>

                            <input
                                type="text"
                                name="username"
                                class="form-control"
                                required>

                        </div>

                        <div class="mb-3">

                            <label>Email Address</label>

                            <input
                                type="email"
                                name="email"
                                class="form-control"
                                required>

                        </div>

                        <div class="mb-3">

                            <label>Phone Number</label>

                            <input
                                type="text"
                                name="phone"
                                class="form-control">

                        </div>

                        <div class="row">

                            <div class="col-md-6 mb-3">

                                <label>Password</label>

                                <input
                                    type="password"
                                    name="password"
                                    class="form-control"
                                    required>

                            </div>

                            <div class="col-md-6 mb-4">

                                <label>Confirm Password</label>

                                <input
                                    type="password"
                                    name="confirm_password"
                                    class="form-control"
                                    required>

                            </div>

                        </div>

                        <button
                            class="btn btn-gold w-100">

                            Create Account

                        </button>

                    </form>

                    <hr>

                    <p class="text-center">

                        Already have an account?

                        <a href="{{ url_for('auth.login') }}">

                            Login

                        </a>

                    </p>

                </div>

            </div>

        </div>

    </div>

</section>

{% endblock %}
