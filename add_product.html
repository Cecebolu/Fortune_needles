```html
{% extends "base.html" %}

{% block title %}Add Product{% endblock %}

{% block content %}

<section class="container py-5 mt-5">

    <div class="row justify-content-center">

        <div class="col-lg-8">

            <div class="card shadow border-0">

                <div class="card-header bg-dark text-white">

                    <h3 class="mb-0">
                        Add New Product
                    </h3>

                </div>

                <div class="card-body">

                    <form
                        method="POST"
                        enctype="multipart/form-data"
                    >

                        <div class="mb-3">

                            <label class="form-label">
                                Product Name
                            </label>

                            <input
                                type="text"
                                name="name"
                                class="form-control"
                                placeholder="Enter product name"
                                required
                            >

                        </div>

                        <div class="mb-3">

                            <label class="form-label">
                                Description
                            </label>

                            <textarea
                                name="description"
                                class="form-control"
                                rows="5"
                                placeholder="Enter product description"
                            ></textarea>

                        </div>

                        <div class="row">

                            <div class="col-md-6">

                                <div class="mb-3">

                                    <label class="form-label">
                                        Category
                                    </label>

                                    <select
                                        name="category"
                                        class="form-select"
                                    >

                                        <option value="Men">
                                            Men's Wear
                                        </option>

                                        <option value="Women">
                                            Women's Wear
                                        </option>

                                        <option value="Kids">
                                            Kids Wear
                                        </option>

                                        <option value="Bridal">
                                            Bridal
                                        </option>

                                        <option value="Accessories">
                                            Accessories
                                        </option>

                                        <option value="Uniforms">
                                            Uniforms
                                        </option>

                                        <option value="Other">
                                            Other
                                        </option>

                                    </select>

                                </div>

                            </div>

                            <div class="col-md-6">

                                <div class="mb-3">

                                    <label class="form-label">
                                        Price (KES)
                                    </label>

                                    <input
                                        type="number"
                                        name="price"
                                        step="0.01"
                                        class="form-control"
                                        placeholder="0.00"
                                        required
                                    >

                                </div>

                            </div>

                        </div>

                        <div class="row">

                            <div class="col-md-6">

                                <div class="mb-3">

                                    <label class="form-label">
                                        Stock
                                    </label>

                                    <input
                                        type="number"
                                        name="stock"
                                        class="form-control"
                                        value="0"
                                        min="0"
                                    >

                                </div>

                            </div>

                            <div class="col-md-6">

                                <div class="mb-3">

                                    <label class="form-label">
                                        Availability
                                    </label>

                                    <select
                                        name="is_available"
                                        class="form-select"
                                    >

                                        <option value="True">
                                            Available
                                        </option>

                                        <option value="False">
                                            Out of Stock
                                        </option>

                                    </select>

                                </div>

                            </div>

                        </div>

                        <div class="mb-4">

                            <label class="form-label">
                                Product Image
                            </label>

                            <input
                                type="file"
                                name="image"
                                class="form-control"
                                accept="image/*"
                            >

                            <small class="text-muted">
                                Upload an image for this product.
                            </small>

                        </div>

                        <div class="d-flex justify-content-between">

                            <a
                                href="{{ url_for('admin_products') }}"
                                class="btn btn-secondary"
                            >
                                Back
                            </a>

                            <button
                                type="submit"
                                class="btn btn-dark"
                            >
                                <i class="bi bi-plus-circle"></i>
                                Save Product
                            </button>

                        </div>

                    </form>

                </div>

            </div>

        </div>

    </div>

</section>

{% endblock %}
```
